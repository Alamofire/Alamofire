name: "Alamofire CI"

on:
  push:
    branches:
      - master
      - hotfix
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "mise.toml"
      - "Source/**"
      - "Tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Package.swift"
      - "mise.toml"
      - "Source/**"
      - "Tests/**"

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Running every test at once starves the test process on hosted runners, especially with a simulator, until timers
  # and requests time out. Tests/TestLifetimes.swift reads this limit.
  ALAMOFIRE_TEST_CONCURRENCY: 4
jobs:
  macOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: "/Applications/${{ matrix.xcode }}.app/Contents/Developer"
      RESULT: "${{ matrix.name }}.xcresult"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_27.2"
            runsOn: xcode-27
            name: "macOS 27, Xcode 27.2, Swift 6.4.2"
          - xcode: "Xcode_27.0"
            runsOn: xcode-27
            name: "macOS 27, Xcode 27.0, Swift 6.4.0"
          - xcode: "Xcode_26.6"
            runsOn: macos-26
            name: "macOS 26, Xcode 26.6, Swift 6.3.3"
          - xcode: "Xcode_26.4"
            runsOn: macos-26
            name: "macOS 26, Xcode 26.4, Swift 6.3.0"
          - xcode: "Xcode_26.3"
            runsOn: macos-26
            name: "macOS 26, Xcode 26.3, Swift 6.2.4"
          - xcode: "Xcode_26.2"
            runsOn: macos-26
            name: "macOS 26, Xcode 26.2, Swift 6.2.3"
          - xcode: "Xcode_26.1"
            runsOn: macos-26
            name: "macOS 26, Xcode 26.1, Swift 6.2.1"
          - xcode: "Xcode_26.0"
            runsOn: macos-26
            name: "macOS 26, Xcode 26.0, Swift 6.2.0"
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: ${{ matrix.name }}
        run: mise run test:macos
      - name: Upload Result File
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "${{ matrix.name }}.xcresult"
          path: "${{ matrix.name }}.xcresult"
  Catalyst:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
      RESULT: "${{ matrix.name }}.xcresult"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_27.2"
            name: "Catalyst 27.2"
            runsOn: xcode-27
          - xcode: "Xcode_27.0"
            name: "Catalyst 27.0"
            runsOn: xcode-27
          - xcode: "Xcode_26.6"
            name: "Catalyst 26.6"
            runsOn: macos-26
          - xcode: "Xcode_26.4"
            name: "Catalyst 26.4"
            runsOn: macos-26
          - xcode: "Xcode_26.3"
            name: "Catalyst 26.3"
            runsOn: macos-26
          - xcode: "Xcode_26.2"
            name: "Catalyst 26.2"
            runsOn: macos-26
          - xcode: "Xcode_26.1"
            name: "Catalyst 26.1"
            runsOn: macos-26
          - xcode: "Xcode_26.0"
            name: "Catalyst 26.0"
            runsOn: macos-26
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: ${{ matrix.name }}
        run: mise run test:catalyst
      - name: Upload Result File
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "${{ matrix.name }}.xcresult"
          path: "${{ matrix.name }}.xcresult"
  iOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: "/Applications/${{ matrix.xcode }}.app/Contents/Developer"
      RESULT: "${{ matrix.name }}.xcresult"
      # Hosted simulators starve the test process more easily than the self-hosted Macs.
      ALAMOFIRE_TEST_CONCURRENCY: ${{ startsWith(matrix.runsOn, 'self-') && '4' || '2' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "27.2"
            device: "iPhone 18 Pro"
            name: "iOS 27.2"
            xcode: "Xcode_27.2"
            runsOn: self-xcode272
          - os: "27.0"
            device: "iPhone 18 Pro"
            name: "iOS 27.0"
            xcode: "Xcode_27.0"
            runsOn: self-xcode270
          - os: "26.5"
            device: "iPhone 17 Pro"
            name: "iOS 26.5"
            xcode: "Xcode_26.6"
            runsOn: macos-26
          - os: "26.4.1"
            device: "iPhone 17 Pro"
            name: "iOS 26.4.1"
            xcode: "Xcode_26.4"
            runsOn: macos-26
          - os: "26.3.1"
            device: "iPhone 17 Pro"
            name: "iOS 26.3.1"
            xcode: "Xcode_26.3"
            runsOn: self-xcode263
          - os: "26.2"
            device: "iPhone 17 Pro"
            name: "iOS 26.2"
            xcode: "Xcode_26.2"
            runsOn: macos-26
          - os: "26.1"
            device: "iPhone 17 Pro"
            name: "iOS 26.1"
            xcode: "Xcode_26.1"
            runsOn: self-xcode261
          - os: "26.0.1"
            device: "iPhone 17 Pro"
            name: "iOS 26.0"
            xcode: "Xcode_26.1"
            runsOn: self-xcode260
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: ${{ matrix.name }}
        run: mise run test:ios "${{ matrix.os }}" "${{ matrix.device }}"
      - name: Upload Result File
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "${{ matrix.name }}.xcresult"
          path: "${{ matrix.name }}.xcresult"
  tvOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
      RESULT: "${{ matrix.name }}.xcresult"
      # Hosted simulators starve the test process more easily than the self-hosted Macs.
      ALAMOFIRE_TEST_CONCURRENCY: ${{ startsWith(matrix.runsOn, 'self-') && '4' || '2' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "27.2"
            device: "Apple TV 4K (4th generation)"
            name: "tvOS 27.2"
            xcode: "Xcode_27.2"
            runsOn: self-xcode272
          - os: "27.0"
            device: "Apple TV 4K (3rd generation)"
            name: "tvOS 27.0"
            xcode: "Xcode_27.0"
            runsOn: self-xcode270
          - os: "26.5"
            device: "Apple TV"
            name: "tvOS 26.5"
            xcode: "Xcode_26.6"
            runsOn: macos-26
          - os: "26.4"
            device: "Apple TV"
            name: "tvOS 26.4"
            xcode: "Xcode_26.4"
            runsOn: macos-26
          - os: "26.2"
            device: "Apple TV"
            name: "tvOS 26.2"
            xcode: "Xcode_26.2"
            runsOn: macos-26
          - os: "26.1"
            device: "Apple TV"
            name: "tvOS 26.1"
            xcode: "Xcode_26.1"
            runsOn: self-xcode261
          - os: "26.0"
            device: "Apple TV"
            name: "tvOS 26.0"
            xcode: "Xcode_26.0"
            runsOn: self-xcode260
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: ${{ matrix.name }}
        run: mise run test:tvos "${{ matrix.os }}" "${{ matrix.device }}"
      - name: Upload Result File
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "${{ matrix.name }}.xcresult"
          path: "${{ matrix.name }}.xcresult"
  visionOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: "/Applications/${{ matrix.xcode }}.app/Contents/Developer"
      RESULT: "${{ matrix.name }}.xcresult"
      # Hosted simulators starve the test process more easily than the self-hosted Macs.
      ALAMOFIRE_TEST_CONCURRENCY: ${{ startsWith(matrix.runsOn, 'self-') && '4' || '2' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "27.2"
            device: "Apple Vision Pro"
            name: "visionOS 27.2"
            xcode: "Xcode_27.2"
            runsOn: self-xcode272
          - os: "27.0"
            device: "Apple Vision Pro"
            name: "visionOS 27.0"
            xcode: "Xcode_27.0"
            runsOn: self-xcode270
          - os: "26.5"
            device: "Apple Vision Pro"
            name: "visionOS 26.5"
            xcode: "Xcode_26.6"
            runsOn: self-xcode266
          - os: "26.4"
            device: "Apple Vision Pro"
            name: "visionOS 26.4"
            xcode: "Xcode_26.4"
            runsOn: self-xcode264
          - os: "26.2"
            device: "Apple Vision Pro"
            name: "visionOS 26.2"
            xcode: "Xcode_26.2"
            runsOn: self-xcode262
          - os: "26.1"
            device: "Apple Vision Pro"
            name: "visionOS 26.1"
            xcode: "Xcode_26.1"
            runsOn: self-xcode261
          - os: "26.0"
            device: "Apple Vision Pro"
            name: "visionOS 26.0"
            xcode: "Xcode_26.0"
            runsOn: self-xcode260
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: ${{ matrix.name }}
        run: mise run test:visionos "${{ matrix.os }}" "${{ matrix.device }}"
      - name: Upload Result File
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "${{ matrix.name }}.xcresult"
          path: "${{ matrix.name }}.xcresult"
  watchOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
      RESULT: "${{ matrix.name }}.xcresult"
      # Hosted simulators starve the test process more easily than the self-hosted Macs.
      ALAMOFIRE_TEST_CONCURRENCY: ${{ startsWith(matrix.runsOn, 'self-') && '4' || '2' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "27.2"
            device: "Apple Watch Series 12 (46mm)"
            name: "watchOS 27.2"
            xcode: "Xcode_27.2"
            runsOn: self-xcode272
          - os: "27.0"
            device: "Apple Watch Series 12 (46mm)"
            name: "watchOS 27.0"
            xcode: "Xcode_27.0"
            runsOn: self-xcode270
          - os: "26.5"
            device: "Apple Watch Series 11 (46mm)"
            name: "watchOS 26.5"
            xcode: "Xcode_26.6"
            runsOn: macos-26
          - os: "26.4"
            device: "Apple Watch Series 11 (46mm)"
            name: "watchOS 26.4"
            xcode: "Xcode_26.4"
            runsOn: macos-26
          - os: "26.2"
            device: "Apple Watch Series 11 (46mm)"
            name: "watchOS 26.2"
            xcode: "Xcode_26.2"
            runsOn: macos-26
          - os: "26.1"
            device: "Apple Watch Series 11 (46mm)"
            name: "watchOS 26.1"
            xcode: "Xcode_26.1"
            runsOn: self-xcode261
          - os: "26.0"
            device: "Apple Watch Series 11 (46mm)"
            name: "watchOS 26.0"
            xcode: "Xcode_26.0"
            runsOn: self-xcode260
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: ${{ matrix.name }}
        run: mise run test:watchos "${{ matrix.os }}" "${{ matrix.device }}"
      - name: Upload Result File
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: "${{ matrix.name }}.xcresult"
          path: "${{ matrix.name }}.xcresult"
  SPM:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: "/Applications/${{ matrix.xcode }}.app/Contents/Developer"
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "Xcode_27.2"
            runsOn: xcode-27
            name: "macOS 27, SPM 6.4.2 Test"
          - xcode: "Xcode_27.0"
            runsOn: xcode-27
            name: "macOS 27, SPM 6.4.0 Test"
          - xcode: "Xcode_26.6"
            runsOn: macos-26
            name: "macOS 26, SPM 6.3.3 Test"
          - xcode: "Xcode_26.4"
            runsOn: macos-26
            name: "macOS 26, SPM 6.3.0 Test"
          - xcode: "Xcode_26.3"
            runsOn: macos-26
            name: "macOS 26, SPM 6.2.4 Test"
          - xcode: "Xcode_26.2"
            runsOn: macos-26
            name: "macOS 26, SPM 6.2.3 Test"
          - xcode: "Xcode_26.1"
            runsOn: macos-26
            name: "macOS 26, SPM 6.2.1 Test"
          - xcode: "Xcode_26.0"
            runsOn: macos-26
            name: "macOS 26, SPM 6.2.0 Test"
    steps:
      - uses: actions/checkout@v7
      # Installs mise and the tools in mise.toml. The test tasks start Firewalk themselves.
      - uses: jdx/mise-action@v5
      - name: Test SPM
        run: mise run test:spm
  Linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: swift:6.3-bookworm
          - image: swift:6.3-jammy
          - image: swift:6.3-noble
          - image: swift:6.3-rhel-ubi9
          - image: swift:6.4-bookworm
          - image: swift:6.4-jammy
          - image: swift:6.4-noble
          - image: swift:6.4-resolute
          - image: swift:6.4-rhel-ubi9
          - image: swiftlang/swift:nightly-jammy
          - image: swiftlang/swift:nightly-noble
          - image: swiftlang/swift:nightly-ubuntu-resolute
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.image }}
        run: swift build --build-tests -c debug
  Android:
    name: Android
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Build for Android"
        uses: skiptools/swift-android-action@v2
        with:
          build-tests: true
          run-tests: false
  Windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # - branch: swift-6.4-release
          #   tag: 6.4-RELEASE
          #   name: Windows Swift 6.4
          - branch: swift-6.3-release
            tag: 6.3-RELEASE
            name: Windows Swift 6.3
          - branch: swift-6.2-release
            tag: 6.2-RELEASE
            name: Windows Swift 6.2
    steps:
      - name: Setup
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: ${{ matrix.branch }}
          swift-build: ${{ matrix.tag }}
      - name: Clone
        uses: actions/checkout@v7
      - name: SPM ${{ matrix.name }}
        run: |
          swift build --build-tests -c debug -Xlinker /INCREMENTAL:NO -v
  CodeQL:
    name: Analyze with CodeQL
    runs-on: macOS-26
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
    timeout-minutes: 20
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
      - name: Build macOS
        run: mise run build:macos
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
