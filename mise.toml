# Alamofire's CI tools and tasks, runnable locally and from GitHub Actions. `mise install` installs the tools, `mise tasks`
# lists the tasks, and `mise run <task> --help` shows a task's arguments.
#
# Settings, all optional, as environment variables:
#   OS      Simulator OS version, such as 27.2. Defaults to the newest runtime with a matching device.
#   DEVICE  Simulator name, such as "iPhone 18 Pro". Defaults to the first matching device on OS.
#   XCODE   Xcode to use, such as Xcode_27.2 for /Applications/Xcode_27.2.app. Defaults to the selected Xcode.
#   RESULT  Result bundle path. Defaults to .build/results/<platform>.xcresult.
#   ARGS    Extra arguments for xcodebuild or swift test, such as -only-testing:"Alamofire iOS Tests/RequestTests".
#   ALAMOFIRE_TEST_CONCURRENCY  The most tests to run at once. Unlimited by default. CI sets it for its smaller machines.
# The simulator tasks also take OS and DEVICE as arguments. Test tasks start Firewalk first if it isn't running.
#
# Examples:
#   mise run test:ios
#   mise run test:tvos 27.2 "Apple TV 4K (4th generation)"
#   XCODE=Xcode_27.2 mise run test:macos

[tools]
xcbeautify = "3.2.1"
# Firewalk's release has a single universal macOS binary, so name the asset.
"github:Alamofire/Firewalk" = { version = "0.15.0", asset_pattern = "firewalk.zip" }

[settings]
# Otherwise mise expands `$NAME` references in [vars] when it loads this file, before the shell code there runs.
env_shell_expand = false

[env]
NSUnbufferedIO = "YES"

# mise ignores a default shell set in a project's config, so each script task names its own. `-u` is left off because
# bash 3.2, which macOS ships, treats an empty array as unset.

[tasks.firewalk]
description = "Start Firewalk unless it's already running, and wait until it answers."
shell = "bash -eo pipefail -c"
quiet = true
run = '''
url=http://localhost:8080/get
if curl -sf -o /dev/null $url; then echo "Firewalk is already running."; exit 0; fi
mkdir -p .build
# Parallel tests open hundreds of connections at once, more than the default open file limit allows.
ulimit -n 10240
nohup firewalk > .build/firewalk.log 2>&1 &
for _ in $(seq 1 30); do curl -sf -o /dev/null $url && exit 0; sleep 1; done
echo "Firewalk didn't start. Its log:" >&2; cat .build/firewalk.log >&2; exit 1
'''

[tasks."test:macos"]
description = "Test on macOS."
depends = ["firewalk"]
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
run_xcodebuild "Alamofire macOS" macOS "platform=macOS" macOS test
'''

[tasks."test:catalyst"]
description = "Test on Mac Catalyst."
depends = ["firewalk"]
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
run_xcodebuild "Alamofire iOS" iOS "platform=macOS,variant=Mac Catalyst" Catalyst test
'''

[tasks."test:ios"]
description = "Test on an iOS simulator."
depends = ["firewalk"]
usage = '''
arg "[os]" help="Simulator OS version, such as 27.2" default=""
arg "[device]" help="Simulator name, such as \"iPhone 18 Pro\"" default=""
'''
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
test_on_simulator iOS iPhone "${usage_os:-${OS:-}}" "${usage_device:-${DEVICE:-}}"
'''

[tasks."test:tvos"]
description = "Test on a tvOS simulator."
depends = ["firewalk"]
usage = '''
arg "[os]" help="Simulator OS version, such as 27.2" default=""
arg "[device]" help="Simulator name, such as \"Apple TV 4K (4th generation)\"" default=""
'''
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
test_on_simulator tvOS "Apple TV" "${usage_os:-${OS:-}}" "${usage_device:-${DEVICE:-}}"
'''

[tasks."test:visionos"]
description = "Test on a visionOS simulator."
depends = ["firewalk"]
usage = '''
arg "[os]" help="Simulator OS version, such as 27.2" default=""
arg "[device]" help="Simulator name, such as \"Apple Vision Pro\"" default=""
'''
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
test_on_simulator visionOS "Apple Vision" "${usage_os:-${OS:-}}" "${usage_device:-${DEVICE:-}}"
'''

[tasks."test:watchos"]
description = "Test on a watchOS simulator."
depends = ["firewalk"]
usage = '''
arg "[os]" help="Simulator OS version, such as 27.2" default=""
arg "[device]" help="Simulator name, such as \"Apple Watch Series 12 (46mm)\"" default=""
'''
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
test_on_simulator watchOS "Apple Watch" "${usage_os:-${OS:-}}" "${usage_device:-${DEVICE:-}}"
'''

[tasks."test:spm"]
description = "Test with SwiftPM."
depends = ["firewalk"]
shell = "bash -eo pipefail -c"
quiet = true
run = '''
eval "args=(${ARGS:-})"
swift test -c debug "${args[@]}" 2>&1 | xcbeautify ${GITHUB_ACTIONS:+--renderer github-actions}
'''

[tasks."build:macos"]
description = "Build for macOS without testing, as CodeQL does."
shell = "bash -eo pipefail -c"
quiet = true
run = '''
{{vars.functions}}
run_xcodebuild "Alamofire macOS" "" "platform=macOS" build-macOS build
'''

# Shared by the tasks above, so each runs in one shell and only the task that was asked for reports a failure. mise
# renders this as a template, so it can't contain `{#`, `{{`, or `{%`.
[vars]
functions = '''
# run_xcodebuild SCHEME PLAN DESTINATION NAME ACTION [SIMULATOR_ID]
run_xcodebuild() {
    local scheme=$1 plan=$2 destination=$3 name=$4 action=$5 simulator=${6:-}
    if [ -n "${XCODE:-}" ]; then export DEVELOPER_DIR="/Applications/$XCODE.app/Contents/Developer"; fi
    # xcodebuild passes TEST_RUNNER_ variables on to the tests, without the prefix.
    if [ -n "${ALAMOFIRE_TEST_CONCURRENCY:-}" ]; then export TEST_RUNNER_ALAMOFIRE_TEST_CONCURRENCY="$ALAMOFIRE_TEST_CONCURRENCY"; fi
    local result="${RESULT:-.build/results/$name.xcresult}"
    mkdir -p .build/results
    rm -rf "$result"
    # ARGS is shell text, so evaluate it to keep quoted arguments together.
    eval "local args=(${ARGS:-})"
    xcodebuild_step() {
        # Busy CI machines can take a while to boot a simulator.
        xcodebuild -project Alamofire.xcodeproj -scheme "$scheme" -destination "$destination" -destination-timeout 120 \
            ${plan:+-testPlan "$plan"} "$@" 2>&1 | xcbeautify ${GITHUB_ACTIONS:+--renderer github-actions}
    }

    if [ -z "$simulator" ]; then
        xcodebuild_step -resultBundlePath "$result" "${args[@]}" clean "$action"
        return
    fi

    # Self-hosted Macs run one job after another, and simulators left running slow down the jobs that follow. So shut down
    # the simulator afterwards, unless it was already running.
    local was_booted status=0
    was_booted=$(xcrun simctl list devices -j | jq -r --arg id "$simulator" '[.devices[][] | select(.udid == $id and .state == "Booted")] | length')
    xcodebuild_step -resultBundlePath "$result" "${args[@]}" clean "$action" || status=$?
    if [ "$was_booted" = 0 ]; then xcrun simctl shutdown "$simulator" > /dev/null 2>&1 || true; fi
    return $status
}

# test_on_simulator PLATFORM FAMILY OS DEVICE
# Finds the simulator in simctl, preferring DEVICE on OS. Without DEVICE, picks the first FAMILY device on OS, or on the
# newest runtime that has one.
test_on_simulator() {
    local platform=$1 family=$2 os=$3 device=$4
    local runtime_platform="$platform"
    [ "$platform" = visionOS ] && runtime_platform=xrOS
    # simctl lists runtimes oldest first. Prints the device's ID, name, OS, and how many runtimes share its runtime
    # identifier.
    local picked id name version shared
    picked=$(jq -nr --argjson runtimes "$(xcrun simctl list runtimes available -j)" \
        --argjson devices "$(xcrun simctl list devices available -j)" \
        --arg platform "$runtime_platform" --arg os "$os" --arg device "$device" --arg family "$family" '
        ($runtimes.runtimes | map(select(.platform == $platform))) as $all
        | [$all | map(select($os == "" or .version == $os)) | reverse[] as $runtime
            | ($devices.devices[$runtime.identifier] // [])[]
            | select(if $device == "" then (.name | startswith($family)) else .name == $device end)
            | "\(.udid)|\(.name)|\($runtime.version)|\([$all[] | select(.identifier == $runtime.identifier)] | length)"]
        | first // empty')
    IFS="|" read -r id name version shared <<< "$picked"

    if [ -n "$id" ] && [ -n "$os" ] && [ "$shared" -gt 1 ]; then
        # Runtimes that share an identifier, like iOS 26.4 and 26.4.1, share their devices too, so simctl can't say
        # which one a device runs. Ask xcodebuild, which is slower but matches destinations exactly.
        id=$(xcodebuild -project Alamofire.xcodeproj -scheme "Alamofire $platform" -showdestinations 2>/dev/null \
            | awk -v platform="$platform Simulator" -v os="$os" -v name="$name" '
                index($0, "platform:" platform ",") && index($0, "OS:" os ",") && index($0, ", name:" name " }") {
                    match($0, /id:[^,]+/); print substr($0, RSTART + 3, RLENGTH - 3); exit }')
    fi

    local destination
    if [ -n "$id" ]; then
        destination="id=$id"
        echo "Testing on $name, $platform $version"
    elif [ -n "${device:-$name}" ]; then
        # Let xcodebuild report the missing destination.
        destination="platform=$platform Simulator,OS=${os:-latest},name=${device:-$name}"
        echo "Testing on ${device:-$name}, $platform ${os:-latest}"
    else
        echo "No available $family simulator for $platform $os." >&2
        return 1
    fi

    run_xcodebuild "Alamofire $platform" "$platform" "$destination" "$platform" test "$id"
}
'''
